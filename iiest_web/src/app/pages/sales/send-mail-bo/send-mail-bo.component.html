<div class="container p-3">
    <div class="mb-3">
      <label class="form-label">Select City</label>
      <select class="form-select" [(ngModel)]="selectedCityId">
        <option selected disabled>Select City</option>
        <option *ngFor="let city of cities" [value]="city._id">{{ city.name }}</option>
      </select>
    </div>
  
    <div class="mb-3">
      <label class="form-label">Select Business Category</label>
      <select class="form-select" [(ngModel)]="selectedCategoryId">
        <option selected disabled>Select Category</option>
        <option *ngFor="let type of businessTypes" [value]="type._id">{{ type.name }}</option>
      </select>
    </div>
  
    <div class="text-end">
        <button class="btn btn-secondary me-2" (click)="closeModal()">Close</button>
        <button class="btn btn-primary" (click)="sendMail()">Send Mail</button>
      </div>
  </div>
