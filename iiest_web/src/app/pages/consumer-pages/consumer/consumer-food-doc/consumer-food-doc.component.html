<div class="container mt-4 text-center">
    <h5 class="mb-4 fw-bold">Documents</h5>
  
    <div class="row justify-content-center">
      <div *ngFor="let file of wordFiles" class="col-6 col-sm-4 col-md-3 mb-4">
        <div class="card p-3 text-center h-100 card-hover"
             style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); border: none; cursor: default;">
          
          <!-- Circular Icon -->
          <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
               style="width: 80px; height: 80px; background: #f5f5f5;">
            <fa-icon [icon]="faFileWord" class="fa-2xl text-primary"></fa-icon>
          </div>
          
          <!-- Title -->
          <div class="fw-semibold">{{ file.name }}</div>
          
          <!-- Download Icon -->
          <div class="d-flex justify-content-end align-items-center mt-2 text-muted" style="font-size: 12px;">
            <div style="cursor: pointer;" (click)="downloadFile(file.url)">
              <fa-icon [icon]="faDownload" class="text-primary"></fa-icon>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
