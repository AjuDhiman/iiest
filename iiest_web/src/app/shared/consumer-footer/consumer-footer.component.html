<footer class="bg-light py-3 fixed-bottom border-top">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center">

      <!-- HOME -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="navigateToHome()">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'home'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/home.png" alt="Home" width="20" height="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">HOME</div>
      </div>

      <!-- YOUR ORDERS -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="navigateToInVoice()">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'invoice'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/shopping-cart.png" alt="Orders" width="20" height="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">YOUR ORDERS</div>
      </div>

      <!-- TRAINING -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="selectMenu('training')">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'training'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/training.png" alt="Training" width="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">TRAINING</div>
      </div>

      <!-- CALL -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="makeCall(); selectMenu('call')">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'call'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/phone-call.png" alt="Call" width="50">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">CALL</div>
      </div>

      <!-- NOTIFICATIONS -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="openNotificationModal()">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'notification'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/notification.png" alt="Notification" width="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">NOTIFICATIONS</div>
      </div>

      <!-- EDN -->
      <div class="d-flex flex-column align-items-center text-center gap-1" (click)="selectMenu('edn')">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'edn'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/group (1).png" alt="EDN" width="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">EDN</div>
      </div>

      <!-- OTHERS -->
      <!-- <div class="d-flex flex-column align-items-center text-center gap-1" (click)="navigateToOtherOptions()">
        <div class="d-flex align-items-center justify-content-center"
             [ngClass]="{'image-selection': selectedMenu === 'other-options'}"
             style="width: 50px; height: 50px;">
          <img src="../../../assets/images/consumer-icons/web.png" alt="Others" width="20">
        </div>
        <div class="footer-text-size text-muted fw-bold text-nowrap" style="height: 20px;">OTHERS</div>
      </div> -->

    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="notificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog notification-dialog">
      <div class="modal-content border border-secondary shadow-lg">
        <div class="modal-body p-0">
          <iframe *ngIf="trustedVideoUrl" [src]="trustedVideoUrl" width="100%" height="200" frameborder="0" allowfullscreen class="w-100"></iframe>
        </div>
        <div class="modal-footer py-1 px-2 justify-content-end">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</footer>
